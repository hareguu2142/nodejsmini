<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA API 챗봇</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f4f4f4;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        #chat-container {
            width: 80%;
            max-width: 800px;
            height: 70%;
            border: 1px solid #ccc;
            background-color: #fff;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #dcf8c6;
            align-self: flex-end;
            margin-left: auto; /* Push to right */
        }
        .bot-message {
            background-color: #eee;
            align-self: flex-start;
            margin-right: auto; /* Push to left */
        }
        #input-area {
            width: 80%;
            max-width: 800px;
            display: flex;
        }
        #message-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            font-size: 16px;
        }
        #send-button {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-left: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
            font-size: 16px;
        }
        #send-button:hover {
            background-color: #0056b3;
        }
        #send-button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>NVIDIA API 챗봇</h1>

    <div id="chat-container">
        <!-- Chat messages will appear here -->
    </div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="메시지를 입력하세요...">
        <button id="send-button">전송</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');

            // Basic Markdown-like formatting for newlines
            const formattedText = text.replace(/\n/g, '<br>');
            messageDiv.innerHTML = formattedText; // Use innerHTML to render <br> tags

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to bottom
            return messageDiv; // Return the created div for potential updates (streaming)
        }

        async function sendMessage() {
            const messageText = messageInput.value.trim();
            if (!messageText) return;

            addMessage(messageText, 'user');
            messageInput.value = '';
            sendButton.disabled = true; // Disable button while waiting for response

            let botMessageDiv = addMessage("...", 'bot'); // Placeholder for bot response

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `message=${encodeURIComponent(messageText)}`
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Handle streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let botResponseText = '';
                botMessageDiv.innerHTML = ''; // Clear the placeholder

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    botResponseText += chunk;
                    // Update the bot message div content progressively
                    botMessageDiv.innerHTML = botResponseText.replace(/\n/g, '<br>');
                    chatContainer.scrollTop = chatContainer.scrollHeight; // Keep scrolled to bottom
                }

            } catch (error) {
                console.error('Error sending message:', error);
                botMessageDiv.innerHTML = `오류 발생: ${error.message}`;
                botMessageDiv.style.color = 'red';
            } finally {
                sendButton.disabled = false; // Re-enable button
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        messageInput.focus(); // Focus input on load
    </script>

</body>
</html>
